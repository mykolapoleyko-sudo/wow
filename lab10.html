<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор (RegExp валідація) — Лабораторна робота №10</title>
    <style>
        .error {
            color: red;
            font-size: 0.95em;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <h1>Веб-калькулятор з перевіркою полів (RegExp)</h1>

    <h2>1. Операції над двома операндами</h2>
    <div>
        <label for="num1">Перше число:</label>
        <input type="text" id="num1" placeholder="Наприклад: 12.5">
        <span id="num1Error" class="error"></span>
    </div>
    <br>
    <div>
        <label for="num2">Друге число:</label>
        <input type="text" id="num2" placeholder="Наприклад: 4">
        <span id="num2Error" class="error"></span>
    </div>
    <br>

    <div>
        <button type="button" id="btn-add">Додати (+)</button>
        <button type="button" id="btn-sub">Відняти (-)</button>
        <button type="button" id="btn-mul">Помножити (*)</button>
        <button type="button" id="btn-div">Поділити (/)</button>
        <button type="button" id="btn-clear">Очистити</button>
    </div>

    <p><strong>Результат:</strong> <span id="result">—</span></p>
    <p id="calcError" class="error"></p>

    <hr>

    <h2>2. Обчислення математичного виразу</h2>
    <form id="expressionForm">
        <label for="expr">Математичний вираз:</label>
        <input type="text" id="expr" placeholder="Наприклад: 23 + 45 * 5">
        <button type="submit">Обчислити вираз</button>
        <span id="exprError" class="error"></span>
    </form>
    <p><strong>Результат виразу:</strong> <span id="exprResult">—</span></p>

    <script>
        const num1Input = document.getElementById("num1");
        const num2Input = document.getElementById("num2");
        const num1Error = document.getElementById("num1Error");
        const num2Error = document.getElementById("num2Error");
        const calcError = document.getElementById("calcError");
        const resultSpan = document.getElementById("result");

        // Регулярний вираз для числових операндів (цілі та десяткові числа)
        const numberRegex = /^-?\d+(\.\d+)?$/;

        function validateOperands() {
            num1Error.textContent = "";
            num2Error.textContent = "";
            calcError.textContent = "";

            const raw1 = num1Input.value.trim().replace(",", ".");
            const raw2 = num2Input.value.trim().replace(",", ".");
            let isValid = true;

            if (!numberRegex.test(raw1)) {
                num1Error.textContent = "Помилка: введіть ціле або десяткове число (наприклад, 10 або 3.5).";
                isValid = false;
            }

            if (!numberRegex.test(raw2)) {
                num2Error.textContent = "Помилка: введіть ціле або десяткове число (наприклад, 5 або 2.5).";
                isValid = false;
            }

            if (!isValid) {
                resultSpan.textContent = "—";
                return null;
            }

            return { a: parseFloat(raw1), b: parseFloat(raw2) };
        }

        document.getElementById("btn-add").addEventListener("click", () => {
            const values = validateOperands();
            if (values) resultSpan.textContent = values.a + values.b;
        });

        document.getElementById("btn-sub").addEventListener("click", () => {
            const values = validateOperands();
            if (values) resultSpan.textContent = values.a - values.b;
        });

        document.getElementById("btn-mul").addEventListener("click", () => {
            const values = validateOperands();
            if (values) resultSpan.textContent = values.a * values.b;
        });

        document.getElementById("btn-div").addEventListener("click", () => {
            const values = validateOperands();
            if (values) {
                if (values.b === 0) {
                    resultSpan.textContent = "—";
                    calcError.textContent = "Помилка: ділення на нуль неможливе.";
                } else {
                    resultSpan.textContent = Number((values.a / values.b).toFixed(4));
                }
            }
        });

        document.getElementById("btn-clear").addEventListener("click", () => {
            num1Input.value = "";
            num2Input.value = "";
            num1Error.textContent = "";
            num2Error.textContent = "";
            calcError.textContent = "";
            resultSpan.textContent = "—";
        });

        // Перевірка поля "Математичний вираз"
        const exprForm = document.getElementById("expressionForm");
        const exprInput = document.getElementById("expr");
        const exprError = document.getElementById("exprError");
        const exprResult = document.getElementById("exprResult");

        // Регулярний вираз для простої математичної формули (наприклад, "23 + 45 * 5")
        const expressionRegex = /^\d+(\.\d+)?(\s*[\+\-\*\/]\s*\d+(\.\d+)?)*$/;

        exprForm.addEventListener("submit", function (event) {
            event.preventDefault();
            exprError.textContent = "";
            const rawExpr = exprInput.value.trim().replace(/,/g, ".");

            if (!expressionRegex.test(rawExpr)) {
                exprError.textContent = "Помилка: введіть коректний вираз (наприклад, 23 + 45 * 5).";
                exprResult.textContent = "—";
                return;
            }

            if (/\/\s*0(\.0+)?(\s|$)/.test(rawExpr)) {
                exprError.textContent = "Помилка: ділення на нуль у виразі.";
                exprResult.textContent = "—";
                return;
            }

            const calculated = Function('"use strict"; return (' + rawExpr + ')')();
            exprResult.textContent = Number(calculated.toFixed(4));
        });
    </script>
</body>
</html>
